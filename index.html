<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4ECCB" />
    <title>VINKI</title>
    <script>
  window.addEventListener('error', function(e) {
    document.body.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;font-size:13px;color:#900;background:#fff8e1">ERROR:\n' + (e.error && e.error.stack || e.message) + '</pre>';
  });
  window.addEventListener('unhandledrejection', function(e) {
    document.body.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;font-size:13px;color:#900;background:#fff8e1">PROMISE ERROR:\n' + (e.reason && e.reason.stack || e.reason) + '</pre>';
  });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
