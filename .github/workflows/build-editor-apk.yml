name: Build Vinki Video Editor APK

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/android-video-editor-exynos-3a9nki"
    paths:
      - "android-video-editor/**"
      - ".github/workflows/build-editor-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK r27 y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Clonar whisper.cpp (ASR on-device)
        run: |
          git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp \
            android-video-editor/app/src/main/cpp/third_party/whisper.cpp

      - name: Descargar modelo de segmentación (MediaPipe)
        run: |
          mkdir -p android-video-editor/app/src/main/assets/models
          curl -fL --retry 3 -o android-video-editor/app/src/main/assets/models/selfie_segmenter.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite

      - name: Descargar modelo de voz whisper (q8_0)
        run: |
          curl -fL --retry 3 -o android-video-editor/app/src/main/assets/models/ggml-base-q8_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q8_0.bin

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK (debug)
        run: gradle -p android-video-editor :app:assembleDebug --no-daemon

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vinki-video-editor-apk
          path: android-video-editor/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
